name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos; no cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construir el sitio (Astro)
        uses: withastro/action@v3
        with:
          # Astro 7 requiere Node 22+ (la acción usa 20 por defecto).
          node-version: 22
        env:
          # El `site` y el `base` se toman automáticamente del repositorio,
          # así no hay que editar astro.config.mjs al cambiar de repo.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
